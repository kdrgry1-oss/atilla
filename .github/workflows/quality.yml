name: Quality Gate

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backend:
    name: Backend compile and security unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install focused test dependencies
        run: python -m pip install pytest==9.0.3 pytest-asyncio fastapi pydantic httpx==0.28.1 cryptography==50.0.0 PyJWT==2.15.0
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run focused backend tests
        env:
          PYTHONPATH: backend
        run: >-
          python -m pytest -q
          backend/tests/test_sns_security.py
          backend/tests/test_report_rules.py
          backend/tests/test_open_return_rules.py
          backend/tests/test_stock_audit.py
          backend/tests/test_activity_audit.py
          backend/tests/amazon_helpers_test.py
          backend/tests/test_themes.py
          backend/tests/test_google_auth_flow.py
          backend/tests/test_email_brevo.py
          backend/tests/test_security_hardening.py
          backend/tests/test_dependency_audit_gate.py
          backend/tests/test_shipping_rules.py
          backend/tests/test_registration_names.py
          backend/tests/test_promotion_order.py
          backend/tests/test_full_look.py
          backend/tests/test_route_guards.py
          backend/tests/test_security_fetch.py
          tests/seo_runtime_test.py
          tests/tenant_config_test.py

  security-e2e:
    name: Security end-to-end tests (payment, identity, KVKK, infra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - name: Install backend + test dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install -r backend/requirements-test.txt
      - name: Run security e2e suite (in-memory DB, all outbound mocked)
        env:
          MONGO_URL: "mongodb://127.0.0.1:1/?serverSelectionTimeoutMS=200"
          DB_NAME: ci_security
          JWT_SECRET: ci-only-not-a-secret-ci-only-not-a-secret-0001
        run: python -m pytest -q backend/tests/security_e2e

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install locked dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Run frontend tests
        working-directory: frontend
        run: CI=true yarn test --watchAll=false --runInBand
      - name: Build production frontend
        working-directory: frontend
        run: CI=true npx craco build
