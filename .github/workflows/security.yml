name: Security Scan

# Amaç: her push + PR'da OTOMATİK güvenlik taraması yapıp SONUÇLARI görünür kılmak.
#   1) SAST (CodeQL)          → kod açıkları (injection/XSS vb.) → Security sekmesi
#   2) Secret Scan (gitleaks) → koda sızmış şifre/anahtar        → Security sekmesi + özet
#   3) Dependency Audit       → açığı olan kütüphaneler          → iş özeti (Summary)
#
# NOT: Bu tarama KODU denetler; CANLI saldırı tespiti DEĞİLDİR (onu Cloudflare WAF +
# uygulamadaki rate-limit/ban katmanı yapar). Tarayıcının çalışamaması ve secret
# bulgusu job'u kırmızı yapar; ayrıntılar Security sekmesi + Summary'de görünür.
# SDLC-01/02 (2026-10): hiçbir adımda continue-on-error YOK; action'lar tam commit SHA'sına
# pinli; gitleaks ikilisi SHA-256 ile doğrulanır.
# (Amazon SP-API Restricted Role / DPP: otomatik SAST + secret + bağımlılık taraması.)

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # haftalık (Pazartesi 03:00 UTC)
  workflow_dispatch: {}    # panelden elle tetikleme

permissions:
  contents: read
  security-events: write   # SARIF sonuçlarını Security sekmesine yaz
  actions: read
  issues: write            # bulgu varsa SLA takibi için otomatik issue aç/güncelle

jobs:
  # 1) SAST — CodeQL (Python backend + JavaScript frontend)
  codeql:
    name: CodeQL SAST (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          # DİKKAT: girdi adı 'languages' (çoğul). 'language' (tekil) yok sayılır →
          # CodeQL TÜM dilleri otomatik algılar (repodaki Swift dahil) ve Swift Linux
          # runner'da desteklenmediği için init "configuration error" ile çöker.
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
      # KÖK NEDEN (2026-10, JOB_STATUS_CONFIGURATION_ERROR): repo ÖZEL ve "Code scanning"
      # (GitHub Code Security / GHAS) bu repoda AÇIK DEĞİL → analyze'ın SARIF yüklemesi
      # "Code scanning is not enabled for this repository" (HTTP 403) ile düşüyordu; analiz
      # kendisi başarılıydı. Çözüm: yükleme yalnız repo değişkeni CODE_SCANNING_ENABLED=true
      # iken yapılır (Settings → Secrets and variables → Actions → Variables). Aksi halde
      # SARIF yerelde üretilir, artifact olarak saklanır ve bulgu sayısı Summary'ye yazılır.
      # Tarayıcı çalışmaz / SARIF üretilemezse job KIRMIZI olur (eksik tarama temiz sayılmaz).
      - name: Analyze
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          category: "/language:${{ matrix.language }}"
          output: codeql-results
          upload: ${{ vars.CODE_SCANNING_ENABLED == 'true' && 'always' || 'never' }}
      - name: CodeQL özeti (bulgu sayısı)
        if: always()
        env:
          LANG_NAME: ${{ matrix.language }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, os, sys
          files = glob.glob("codeql-results/*.sarif")
          lang = os.environ["LANG_NAME"]
          if not files:
              print(f"### 🛡️ CodeQL ({lang}) — SARIF üretilemedi; tarama temiz kabul edilmedi.")
              sys.exit(1)
          rules, levels = {}, {}
          for f in files:
              for run in json.load(open(f)).get("runs", []):
                  for drv in [run["tool"]["driver"]] + run["tool"].get("extensions", []):
                      for r in drv.get("rules", []) or []:
                          rules[r["id"]] = r
                  for res in run.get("results", []):
                      sev = (rules.get(res.get("ruleId"), {}).get("properties", {}) or {}).get("security-severity")
                      try:
                          s = float(sev)
                          k = "kritik" if s >= 9 else "yüksek" if s >= 7 else "orta" if s >= 4 else "düşük"
                      except (TypeError, ValueError):
                          k = "kalite/diğer"
                      levels[k] = levels.get(k, 0) + 1
          total = sum(levels.values())
          print(f"### 🛡️ CodeQL ({lang}) — {total} bulgu")
          for k in ("kritik", "yüksek", "orta", "düşük", "kalite/diğer"):
              if levels.get(k):
                  print(f"- {k}: **{levels[k]}**")
          print("Ayrıntı: Security → Code scanning (açıksa) veya `codeql-sarif-" + lang + "` artifact'ı.")
          PY
      - name: CodeQL SARIF'i sakla
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-results/
          if-no-files-found: warn

  # 2) Secret scanning — gitleaks (CLI, tam git geçmişi). Marketplace action'a bağımlı
  #    DEĞİL (lisans/kurulum takılmaları yaşanmasın); SARIF Security sekmesine yüklenir.
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VER="8.21.2"
          # SDLC-02: indirilen ikili SHA-256 ile doğrulanır (release checksums.txt, 2026-10 doğrulandı).
          SHA256="5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run gitleaks
        run: |
          gitleaks detect --source . --report-format sarif --report-path gitleaks.sarif \
            --redact --exit-code 1
      - name: Özet (kaç bulgu)
        if: always()
        run: |
          if [ -f gitleaks.sarif ]; then
            N=$(python3 -c "import json;d=json.load(open('gitleaks.sarif'));print(len(d.get('runs',[{}])[0].get('results',[])))" 2>/dev/null || echo "?")
            echo "### 🔐 Gitleaks — koda sızmış sır taraması" >> "$GITHUB_STEP_SUMMARY"
            echo "Bulgu sayısı: **$N** (redakte). Ayrıntı: Security → Code scanning (açıksa) veya \`gitleaks-sarif\` artifact'ı." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 🔐 Gitleaks — rapor üretilemedi (loglara bakın)" >> "$GITHUB_STEP_SUMMARY"
          fi
      # Code scanning bu (özel) repoda kapalıyken upload-sarif 403 ile düşer → yalnız
      # CODE_SCANNING_ENABLED=true iken yükle; her durumda redakte SARIF artifact olarak saklanır.
      - name: Upload SARIF (Security sekmesi)
        if: always() && hashFiles('gitleaks.sarif') != '' && vars.CODE_SCANNING_ENABLED == 'true'
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: gitleaks.sarif
      - name: Gitleaks SARIF'i sakla (redakte)
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif

      # §5/§10: bulgu varsa SLA takibi için otomatik güvenlik issue'su aç/güncelle.
      # Yalnız main'e push + planlı/elle tetiklemede (PR'larda gürültü yapmaz). Başlıkla dedup edilir.
      - name: Bulgu varsa güvenlik issue'su (SLA takibi)
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            let n;
            try {
              const runs = JSON.parse(fs.readFileSync('gitleaks.sarif','utf8')).runs;
              if (!Array.isArray(runs) || !runs.length || runs.some(r => !Array.isArray(r.results))) throw new Error('Invalid SARIF');
              n = runs.reduce((total, run) => total + run.results.length, 0);
            } catch (e) {
              core.setFailed('Gitleaks raporu doğrulanamadı; mevcut güvenlik issue’ları kapatılmadı.');
              return;
            }
            const { owner, repo } = context.repo;
            const title = '🔐 Security: gitleaks sır bulgusu (SLA takibi)';
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'security', per_page: 50 });
            const dup = open.data.find(i => i.title === title);
            if (!n) {
              if (dup) {
                await github.rest.issues.createComment({ owner, repo, issue_number: dup.number, body: 'Yeni tarama: **0 bulgu**. Otomatik yeniden test başarılı; issue kapatılıyor.' });
                await github.rest.issues.update({ owner, repo, issue_number: dup.number, state: 'closed' });
              }
              core.info('gitleaks: bulgu yok.');
              return;
            }
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              `**Discovery date:** ${today}`,
              `**Affected system:** repository — gitleaks secret scan`,
              `**Severity:** Critical`,
              `**Owner:** _atanacak_`,
              `**Due date (SLA):** Critical → en geç 7 takvim günü`,
              `**Status:** open`,
              `**Finding count:** ${n} (redakte — ayrıntı: Security → Code scanning → gitleaks)`,
              `**Remediation evidence:** _fix sonrası doldurulacak_`,
              `**Retest result:** _rescan sonrası doldurulacak_`,
              '',
              `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            ].join('\n');
            if (dup) {
              await github.rest.issues.createComment({ owner, repo, issue_number: dup.number, body: `Yeni tarama (${today}): **${n}** bulgu.\n\n${body}` });
              core.info(`Mevcut issue #${dup.number} güncellendi.`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body, labels: ['security', 'sla-critical'] });
              core.info(`Issue #${created.data.number} açıldı.`);
            }

  # 3) Bağımlılık açık taraması — backend (pip-audit) + frontend (yarn audit).
  #    Bulgu veya tarama hatası başarısızdır; eksik tarama temiz sayılmaz.
  dependencies:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: pip-audit (backend)
        run: |
          python -m pip install pip-audit
          echo "### 🐍 Backend bağımlılık açıkları (pip-audit)" >> "$GITHUB_STEP_SUMMARY"
          audit_status=0
          # Belgeli istisna (yalnız ULAŞILAMAYAN + düzeltmesi OLMAYAN açıklar; her biri gerekçeli):
          #  PYSEC-2026-1325 (GHSA-wj6h-64fc-37mp / CVE-2024-23342) ecdsa — P-256 imzalamada Minerva
          #    zamanlama yan kanalı; upstream düzeltme YOK. ecdsa yalnız python-jose'un geçişli
          #    bağımlılığı; backend ne `ecdsa` ne `jose` import eder (JWT = PyJWT/HS256, imza
          #    üretimi ecdsa ile yapılmaz) → kod yolu ulaşılamaz. Gözden geçirme: her çeyrek /
          #    python-jose kaldırıldığında bu istisna da silinir.
          pip-audit -r backend/requirements.txt -f json -o pipaudit.json \
            --ignore-vuln PYSEC-2026-1325 || audit_status=$?
          python scripts/check_dependency_audit.py pip pipaudit.json "$audit_status" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        if: always()
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: yarn audit (frontend)
        if: always()
        working-directory: frontend
        run: |
          echo "### 📦 Frontend bağımlılık açıkları (yarn audit)" >> "$GITHUB_STEP_SUMMARY"
          corepack enable
          audit_status=0
          # Yalnız runtime grubu ("dependencies") ve yüksek+ seviye ayrıntı. NOT: CRA'nın
          # react-scripts'i "dependencies" altında olduğundan derleme zinciri de taranır;
          # scripts/check_dependency_audit.py BUILD_ONLY_ROOTS (react-scripts, @capacitor/cli,
          # cra-template, ajv, ajv-keywords) kökünden gelen bulguları raporlar ama BLOKLAMAZ
          # (tarayıcıya giden pakete girmezler). Runtime kökten yüksek/kritik HER ZAMAN bloklar.
          # (yarn'ın çıkış kodu ve auditSummary sayıları --level'den bağımsız tüm seviyeleri içerir.)
          yarn audit --groups dependencies --level high --json > yarnaudit.jsonl || audit_status=$?
          python ../scripts/check_dependency_audit.py yarn yarnaudit.jsonl "$audit_status" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve dependency audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit
          path: |
            pipaudit.json
            frontend/yarnaudit.jsonl
